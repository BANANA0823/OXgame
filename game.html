<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
  content="width=device-width,initial-scale=1.0">
<title>Gravity Four</title>
<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  min-height:100vh;
  font-family:sans-serif;
  color:#fff;
  background:#1f4d35;
  display:flex;
  justify-content:center;
  align-items:center;
}
.game-container{
  width:100%;
  max-width:760px;
  padding:15px;
}
h1{
  margin:0 0 5px;
  text-align:center;
  font-size:32px;
}
.description,
.room-status{
  text-align:center;
  color:rgba(255,255,255,.7);
  font-size:14px;
  margin:5px 0;
}
.turn-box{
  padding:10px;
  margin-bottom:10px;
  border:2px solid rgba(255,255,255,.3);
  border-radius:10px;
  text-align:center;
  background:rgba(0,0,0,.1);
}
#turnDisplay{
  font-size:24px;
  font-weight:bold;
}
.players{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:5px;
  margin-bottom:10px;
}
.player{
  padding:5px;
  border:2px solid rgba(255,255,255,.2);
  border-radius:8px;
  text-align:center;
  background:rgba(0,0,0,.15);
  font-size:12px;
}
.player.active{
  border-color:#ffeb3b;
  background:rgba(255,255,255,.1);
}
.player.me{
  border-color:#fff;
  box-shadow:0 0 10px #fff;
}
.player-symbol{
  font-size:20px;
  font-weight:bold;
}
.player-name-text{
  font-size:11px;
  overflow:hidden;
  text-overflow:ellipsis;
}
.board-wrapper{
  padding:10px;
  border:3px solid rgba(255,255,255,.3);
  border-radius:8px;
  background:#173d2a;
}
.board{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:5px;
}
.cell{
  aspect-ratio:1;
  display:flex;
  justify-content:center;
  align-items:center;
  border:1px dashed rgba(255,255,255,.2);
  border-radius:50%;
  cursor:pointer;
  font-size:24px;
  font-weight:bold;
  background:rgba(0,0,0,0.1);
}
.hint{
  text-align:center;
  margin:10px 0;
  font-size:13px;
  color:rgba(255,255,255,.7);
}
button{
  width:100%;
  height:45px;
  border:2px solid rgba(255,255,255,.4);
  border-radius:8px;
  background:rgba(0,0,0,.2);
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}
#resultOverlay{
  position:fixed;
  inset:0;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.8);
  z-index:1000;
}
.result-box{
  width:90%;
  max-width:400px;
  padding:30px;
  text-align:center;
  border:2px solid #fff;
  border-radius:12px;
  background:#1f4d35;
}
#resultText{
  margin-bottom:20px;
  font-size:32px;
  font-weight:bold;
}
</style>
</head><body>
<div class="game-container">
<h1>🌌 Gravity Four</h1>
<div class="description">4人用重力マルバツゲーム</div>
<div id="myPlayerStatus" class="room-status">プレイヤー番号を確認中…</div>
<div id="roomStatus" class="room-status">接続中…</div>
<div class="turn-box"><div id="turnDisplay">接続中…</div></div>
<div class="players">
  <div class="player" id="player0"><div class="player-symbol">〇</div><div class="player-name-text" id="nt0">P1</div></div>
  <div class="player" id="player1"><div class="player-symbol">×</div><div class="player-name-text" id="nt1">P2</div></div>
  <div class="player" id="player2"><div class="player-symbol">△</div><div class="player-name-text" id="nt2">P3</div></div>
  <div class="player" id="player3"><div class="player-symbol">□</div><div class="player-name-text" id="nt3">P4</div></div>
</div>
<div class="board-wrapper"><div id="board" class="board"></div></div>
<div id="hint" class="hint">接続中…</div>
<div id="error" style="color:#ffcccc;"></div>
<button onclick="resetGame()">🔄 リセット</button>
</div>
<div id="resultOverlay">
  <div class="result-box">
    <div id="resultText"></div>
    <button onclick="resetGame()">🔄 もう一回遊ぶ</button>
  </div>
</div>

<script src="https://jsdelivr.net"></script>
<script>
const ROWS=6,COLS=8;
const players=[
  {name:'プレイヤー1',symbol:'〇'},
  {name:'プレイヤー2',symbol:'×'},
  {name:'プレイヤー3',symbol:'△'},
  {name:'プレイヤー4',symbol:'□'}
];
const SUPABASE_URL='https://supabase.co';
const SUPABASE_KEY='sb_publishable_qhq0mWdLBc__w6mBVn4-eA_LfOW7t-q';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// 【重要】URLにルーム名がない時は自動的に「1234」をくっつける安全装置
let urlParams = new URLSearchParams(location.search);
let roomId = (urlParams.get('room') || '').trim();
if(!roomId){
  roomId = "1234";
  window.history.pushState({}, '', `?room=${roomId}`);
}

const channelName='4mokoshi-room-'+roomId;
let clientId=localStorage.getItem('4mokoshi-client-id');
if(!clientId){
  clientId=crypto.randomUUID();
  localStorage.setItem('4mokoshi-client-id',clientId);
}
let joinedAt=Date.now(),channel=null,myPlayer=-1,roster={},board=empty(),currentPlayer=0,gameOver=false,synced=false;
let gameStarted=false, myNickname="";

function empty(){ return Array.from({length:ROWS},()=>Array(COLS).fill(null)); }

window.onload = function() {
  myNickname = prompt("ゲームでつかう なまえ を入力してね", "プレイヤー" + Math.floor(Math.random()*100));
  if (!myNickname) myNickname = "ゲスト";
  initGame();
};

function initGame(){
  initBoard();
  channel=sb.channel(channelName,{config:{broadcast:{self:true}}});
  channel.on('broadcast',{event:'join'},({payload})=>{
    roster[payload.id]=payload; updateRoster();
  }).on('broadcast',{event:'leave'},({payload})=>{
    delete roster[payload.id]; updateRoster();
  }).on('broadcast',{event:'sync'},({payload})=>{
    board=payload.board; currentPlayer=payload.currentPlayer; gameOver=payload.gameOver; gameStarted=payload.gameStarted;
    for(let i=0; i<4; i++) { if(payload.playerNames[i]) players[i].name = payload.playerNames[i]; }
    render();
  }).on('broadcast',{event:'req'},()=>{
    if(myPlayer===0) sendState();
  });
  channel.subscribe((status)=>{
    if(status==='SUBSCRIBED'){
      channel.send({type:'broadcast',event:'join',payload:{id:clientId,joinedAt,name:myNickname}});
      setTimeout(()=>{ if(!synced) channel.send({type:'broadcast',event:'req',payload:{}}); },1000);
    }
  });
  setInterval(()=>{ if(channel) channel.send({type:'broadcast',event:'join',payload:{id:clientId,joinedAt,name:myNickname}}); },4000);
}

function initBoard(){
  const b=document.getElementById('board');
  b.innerHTML='';
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++){
      let e=document.createElement('div');
      e.className='cell'; e.id='cell-'+r+'-c'+c; e.onclick=()=>dropPiece(c); b.appendChild(e);
    }
  }
  render();
}

function render(){
  for(let r=0;r<ROWS;r++) {
    for(let c=0;c<COLS;c++){
      let e=document.getElementById('cell-'+r+'-c'+c);
      if(e) { e.textContent=board[r][c]!==null ? players[board[r][c]].symbol : ''; }
    }
  }
  updateTurn();
}

function updateRoster(){
  let a=Object.values(roster).sort((x,y)=>x.joinedAt-y.joinedAt||x.id.localeCompare(y.id));
  myPlayer=a.findIndex(x=>x.id===clientId);
  if(myPlayer>3) myPlayer=-1; synced=true;
  if (!gameStarted) {
    for(let i=0;i<4;i++){ players[i].name = i<a.length ? a[i].name : "（待機中）"; }
  }
  for(let i=0;i<4;i++){
    let e=document.getElementById('player'+i);
    let t=document.getElementById('nt'+i);
    if(e && t) {
      t.innerText = players[i].name;
      e.style.opacity=players[i].name !== "（待機中）" ? "1" : ".45"; e.classList.remove('me');
      if(i===myPlayer) e.classList.add('me');
    }
  }
  document.getElementById('roomStatus').textContent = "ルーム: " + roomId + "　人数: " + Math.min(a.length,4) + "/4";
  updateTurn();
}

function updateTurn(){
  if(!synced)return;
  const p=players[currentPlayer];
  const display=document.getElementById("turnDisplay");
  const myStatus=document.getElementById("myPlayerStatus");
  document.querySelectorAll(".player").forEach(e=>e.classList.remove("active"));
  let targetEl=document.getElementById("player"+currentPlayer);
  if(targetEl) targetEl.classList.add("active");
  
  if(myPlayer===-1){ myStatus.textContent="あなたは観戦モードです"; }
  else{ myStatus.textContent = "あなたは 1P: " + players[myPlayer].name + " です"; }

  if (!gameStarted) {
    if (myPlayer === 0) {
      display.textContent = "あなたが1Pです。タップして開始！";
      document.getElementById('hint').textContent = "足りない枠は自動でCPUになります。";
    } else {
      display.textContent = "1Pの開始を待っています...";
      document.getElementById('hint').textContent = "1Pが打つまでお待ちください。";
    }
    return;
  }
  if(gameOver){
    display.textContent="ゲーム終了！";
    document.getElementById('hint').textContent = "リセットボタンで最初から遊べます。";
  }else{
    display.textContent=p.name + " の番 (" + p.symbol + ")";
    if(currentPlayer===myPlayer){
      display.textContent="あなたの番です！";
      document.getElementById('hint').textContent = "落としたい列をタップしてね";
    }else{
      document.getElementById('hint').textContent = p.name + "が考えています...";
    }
  }
}

function dropPiece(col){
  if(gameOver)return;
  if (!gameStarted) {
    if (myPlayer === 0) {
      gameStarted = true;
      for(let i=0; i<4; i++) {
        if(players[i].name==="（待機中）") { players[i].name="CPU-" + players[i].symbol; }
      }
    } else { return; }
  }
  if(currentPlayer!==myPlayer)return;
  if(players[currentPlayer].name.includes("CPU")) return;
  let row=-1;
  for(let r=ROWS-1;r>=0;r--) { if(board[r][col]===null){ row=r; break; } }
  if(row===-1)return;
  executeMove(row, col);
}

function executeMove(row, col) {
  board[row][col]=currentPlayer; render();
  if(checkWin(row,col,currentPlayer)){
    gameOver=true; document.getElementById('resultText').textContent = players[currentPlayer].name + " の勝ち！！！";
    document.getElementById('resultOverlay').style.display='flex'; sendState(); return;
  }
  if(board.every(r=>r.every(c=>c!==null))){
    gameOver=true; document.getElementById('resultText').textContent = "引き分け！";
    document.getElementById('resultOverlay').style.display='flex'; sendState(); return;
  }
  currentPlayer=(currentPlayer+1)%4; sendState();
  if(!gameOver && players[currentPlayer].name.includes("CPU") && myPlayer === 0){ setTimeout(cpuTurn, 700); }
}

function cpuTurn(){
  if(gameOver) return;
  let ok=[];
