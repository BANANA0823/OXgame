<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4目落とし</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        "Arial Rounded MT Bold",
        "Hiragino Maru Gothic ProN",
        system-ui,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.04),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.03),
            transparent 25%
        ),
        #1f4d35;

    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 7px,
            rgba(255,255,255,0.06) 8px
        );
}

.game-container{
    width:100%;
    max-width:760px;
    padding:18px;
}

h1{
    margin:0 0 5px;
    text-align:center;

    font-size:
        clamp(30px,8vw,52px);

    color:#fff;

    text-shadow:
        0 0 8px
        rgba(255,255,255,0.2);
}

.description{
    text-align:center;
    color:rgba(255,255,255,0.75);
    margin-bottom:15px;
}

.turn-box{
    padding:14px;
    margin-bottom:12px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-radius:12px;
    text-align:center;

    background:
        rgba(0,0,0,0.12);

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,0.15);
}

.turn-label{
    font-size:14px;
    color:rgba(255,255,255,0.65);
}

#turnDisplay{
    margin-top:3px;

    font-size:
        clamp(27px,8vw,42px);

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 10px
        rgba(255,255,255,0.35);
}

.players{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:15px;
}

.player{
    padding:8px 4px;

    border:
        2px solid
        rgba(255,255,255,0.25);

    border-radius:10px;
    text-align:center;

    background:
        rgba(0,0,0,0.15);

    transition:0.2s;
}

.player-symbol{
    font-size:27px;
    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 6px
        rgba(255,255,255,0.4);
}

.player.active{
    transform:scale(1.06);

    border-color:#fff;

    background:
        rgba(255,255,255,0.12);

    box-shadow:
        0 0 8px
        rgba(255,255,255,0.8),

        0 0 22px
        rgba(255,255,255,0.4);
}

.board-wrapper{
    position:relative;

    padding:11px;

    border:
        3px solid
        rgba(255,255,255,0.35);

    border-radius:8px;

    background:
        radial-gradient(
            circle at 50% 50%,
            #25583d,
            #173d2a
        );

    box-shadow:
        inset 0 0 25px
        rgba(0,0,0,0.4),

        0 8px 25px
        rgba(0,0,0,0.35);
}

.board{
    position:relative;

    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:6px;
}

.cell{
    aspect-ratio:1 / 1;

    display:flex;
    justify-content:center;
    align-items:center;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius:5px;

    cursor:pointer;
    user-select:none;

    color:#fff;

    font-size:
        clamp(24px,7vw,48px);

    font-weight:bold;

    text-shadow:
        0 0 5px
        rgba(255,255,255,0.45);

    transition:
        background 0.15s,
        transform 0.1s;
}

.cell:hover{
    background:
        rgba(255,255,255,0.07);
}

.cell:active{
    transform:scale(0.94);
}

.drop{
    animation:
        chalkDrop
        0.35s
        ease-out;
}

@keyframes chalkDrop{

    0%{
        transform:translateY(-45px);
        opacity:0;
    }

    70%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }
}

/* 勝利した4個 */

.winning-cell{
    animation:
        winningChalk
        0.45s
        ease-in-out
        infinite alternate;
}

@keyframes winningChalk{

    from{
        text-shadow:
            0 0 4px white;
    }

    to{
        text-shadow:
            0 0 15px white,
            0 0 25px
            rgba(255,255,255,0.7);
    }
}

/* チョーク線 */

.win-line{
    position:absolute;

    height:5px;

    background:#fff;

    border-radius:50%;

    transform-origin:left center;

    pointer-events:none;

    z-index:50;

    box-shadow:
        0 0 5px white,
        0 0 12px
        rgba(255,255,255,0.7);

    /*
       transformはJSの回転を使うので、
       clip-pathだけで線を描く
    */

    animation:
        chalkLine
        0.9s
        ease-out
        forwards;
}

.win-line::after{
    content:"";

    position:absolute;
    left:0;
    top:2px;

    width:100%;
    height:2px;

    background:
        rgba(255,255,255,0.45);
}

@keyframes chalkLine{

    from{
        clip-path:inset(0 100% 0 0);
    }

    to{
        clip-path:inset(0 0 0 0);
    }
}

.hint{
    text-align:center;

    margin:13px 0;

    color:
        rgba(255,255,255,0.75);
}

button{
    width:100%;
    height:50px;

    border:
        2px solid
        rgba(255,255,255,0.5);

    border-radius:10px;

    background:
        rgba(0,0,0,0.2);

    color:#fff;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;
    font-family:inherit;
}

button:hover{
    background:
        rgba(255,255,255,0.12);
}

button:active{
    transform:scale(0.97);
}

#resultOverlay{
    position:fixed;
    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        rgba(0,0,0,0.72);

    z-index:1000;
}

.result-box{
    width:100%;
    max-width:430px;

    padding:35px 25px;

    text-align:center;

    border:
        3px solid
        rgba(255,255,255,0.5);

    border-radius:15px;

    background:#1f4d35;

    box-shadow:
        0 0 30px
        rgba(255,255,255,0.2);

    animation:
        resultPop
        0.35s
        ease;
}

@keyframes resultPop{

    0%{
        transform:scale(0.5);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

#resultText{
    margin-bottom:25px;

    font-size:
        clamp(34px,10vw,52px);

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.5);
}

@media(max-width:500px){

    .game-container{
        padding:10px;
    }

    .board-wrapper{
        padding:6px;
    }

    .board{
        gap:3px;
    }

    .players{
        gap:4px;
    }

    .player{
        font-size:12px;
    }

    .player-symbol{
        font-size:23px;
    }
}

</style>
</head>


<body>

<div class="game-container">

    <h1>🎮 4目落とし</h1>

    <div class="description">
        黒板で遊ぶ、4人用ゲーム
    </div>


    <div class="turn-box">

        <div class="turn-label">
            現在のターン
        </div>

        <div id="turnDisplay">
            プレイヤー1「〇」の番
        </div>

    </div>


    <div class="players">

        <div class="player" id="player0">
            <div class="player-symbol">〇</div>
            P1
        </div>

        <div class="player" id="player1">
            <div class="player-symbol">×</div>
            P2
        </div>

        <div class="player" id="player2">
            <div class="player-symbol">△</div>
            P3
        </div>

        <div class="player" id="player3">
            <div class="player-symbol">□</div>
            P4
        </div>

    </div>


    <div
        class="board-wrapper"
        id="boardWrapper"
    >

        <div
            id="board"
            class="board"
        ></div>

    </div>


    <div class="hint">
        👆 入れたい列をタップ！
    </div>


    <button onclick="resetGame()">
        🔄 ゲームをリセット
    </button>

</div>


<div id="resultOverlay">

    <div class="result-box">

        <div id="resultText"></div>

        <button onclick="resetGame()">
            🔄 もう一回遊ぶ
        </button>

    </div>

</div>


<script>

const ROWS = 6;
const COLS = 8;

const players = [

    {
        name:"プレイヤー1",
        symbol:"〇"
    },

    {
        name:"プレイヤー2",
        symbol:"×"
    },

    {
        name:"プレイヤー3",
        symbol:"△"
    },

    {
        name:"プレイヤー4",
        symbol:"□"
    }

];

let board = [];
let currentPlayer = 0;
let gameOver = false;


/* =========================
   ゲーム開始
========================= */

function initGame(){

    board = [];

    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        board[row] = [];

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            board[row][col] = null;

        }

    }

    currentPlayer = 0;
    gameOver = false;


    /*
       ★ 前の勝利ラインを完全削除
    */

    document
        .querySelectorAll(".win-line")
        .forEach(line => line.remove());


    document
        .getElementById("resultOverlay")
        .style.display = "none";


    createBoard();

    updateTurn();

}


/* =========================
   盤面作成
========================= */

function createBoard(){

    const boardElement =
        document.getElementById("board");

    boardElement.innerHTML = "";


    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            const cell =
                document.createElement("div");


            cell.className = "cell";

            cell.dataset.row = row;
            cell.dataset.col = col;


            cell.addEventListener(
                "click",
                () => dropPiece(col)
            );


            boardElement.appendChild(cell);

        }

    }

}


/* =========================
   コマを落とす
========================= */

function dropPiece(col){

    if(gameOver){
        return;
    }


    let targetRow = -1;


    /*
       下から空いている場所を探す
    */

    for(
        let row = ROWS - 1;
        row >= 0;
        row--
    ){

        if(
            board[row][col] === null
        ){

            targetRow = row;
            break;

        }

    }


    if(targetRow === -1){
        return;
    }


    board[targetRow][col] =
        currentPlayer;


    renderBoard();


    /*
       ★ 勝利判定
    */

    const winningLine =
        findWinningLine(
            targetRow,
            col,
            currentPlayer
        );


    if(winningLine){

        gameOver = true;


        /*
           勝った4マスを光らせる
        */

        highlightWinningCells(
            winningLine
        );


        /*
           まず線を描く
        */

        drawWinLine(
            winningLine
        );


        /*
           ★ 線が0.9秒で描き終わってから
           勝利画面を表示
        */

        setTimeout(
            () => {

                showResult(
                    players[currentPlayer]
                        .symbol +
                    "の勝ち！"
                );

            },
            950
        );


        return;

    }


    /*
       引き分け
    */

    if(isBoardFull()){

        gameOver = true;

        setTimeout(
            () => {

                showResult(
                    "引き分け！"
                );

            },
            300
        );

        return;

    }


    /*
       次のプレイヤー
    */

    currentPlayer++;

    if(
        currentPlayer >=
        players.length
    ){

        currentPlayer = 0;

    }


    updateTurn();

}


/* =========================
   盤面表示
========================= */

function renderBoard(){

    const cells =
        document.querySelectorAll(".cell");


    cells.forEach(cell => {

        const row =
            Number(cell.dataset.row);

        const col =
            Number(cell.dataset.col);


        cell.textContent = "";

        cell.className = "cell";


        if(
            board[row][col] !== null
        ){

            cell.textContent =
                players[
                    board[row][col]
                ].symbol;

            cell.classList.add("drop");

        }

    });

}


/* =========================
   ★ 勝利ラインを探す
========================= */

function findWinningLine(
    row,
    col,
    player
){

    /*
       横 →
       両方向を調べる
    */

    let line =
        getLineBothWays(
            row,
            col,
            0,
            1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       縦 ↓
    */

    line =
        getLineBothWays(
            row,
            col,
            1,
            0,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       斜め ↘
    */

    line =
        getLineBothWays(
            row,
            col,
            1,
            1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       斜め ↙
    */

    line =
        getLineBothWays(
            row,
            col,
            1,
            -1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    return null;

}


/* =========================
   同じ記号を両方向に探す
========================= */

function getLineBothWays(
    row,
    col,
    dr,
    dc,
    player
){

    const line = [];


    /*
       逆方向
    */

    let r = row - dr;
    let c = col - dc;


    while(
        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player
    ){

        line.unshift({
            row:r,
            col:c
        });


        r -= dr;
        c -= dc;

    }


    /*
       自分
    */

    line.push({
        row:row,
        col:col
    });


    /*
       正方向
    */

    r = row + dr;
    c = col + dc;


    while(
        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player
    ){

        line.push({
            row:r,
            col:c
        });


        r += dr;
        c += dc;

    }


    return line;

}


/* =========================
   4個だけ選ぶ
========================= */

function chooseFour(
    line,
    row,
    col
){

    if(line.length === 4){
        return line;
    }


    /*
       今置いたコマの位置
    */

    const index =
        line.findIndex(
            cell =>
                cell.row === row &&
                cell.col === col
        );


    /*
       置いたコマを必ず含む
       4個を選択
    */

    let start =
        Math.max(
            0,
            Math.min(
                index - 3,
                line.length - 4
            )
        );


    return line.slice(
        start,
        start + 4
    );

}


/* =========================
   勝った4個を光らせる
========================= */

function highlightWinningCells(
    line
){

    line.forEach(position => {

        const cell =
            document.querySelector(
                `.cell[data-row="${position.row}"][data-col="${position.col}"]`
            );


        if(cell){

            cell.classList.add(
                "winning-cell"
            );

        }

    });

}


/* =========================
   ★ チョーク線を描く
========================= */

function drawWinLine(line){

    const wrapper =
        document.getElementById(
            "boardWrapper"
        );


    const firstCell =
        document.querySelector(
            `.cell[data-row="${line[0].row}"][data-col="${line[0].col}"]`
        );


    const lastCell =
        document.querySelector(
            `.cell[data-row="${line[3].row}"][data-col="${line[3].col}"]`
        );


    if(
        !firstCell ||
        !lastCell
    ){
        return;
    }


    const wrapperRect =
        wrapper.getBoundingClientRect();


    const firstRect =
        firstCell.getBoundingClientRect();


    const lastRect =
        lastCell.getBoundingClientRect();


    /*
       マスの中心
    */

    const x1 =
        firstRect.left -
        wrapperRect.left +
        firstRect.width / 2;


    const y1 =
        firstRect.top -
        wrapperRect.top +
        firstRect.height / 2;


    const x2 =
        lastRect.left -
        wrapperRect.left +
        lastRect.width / 2;


    const y2 =
        lastRect.top -
        wrapperRect.top +
        lastRect.height / 2;


    /*
       長さ
    */

    const dx = x2 - x1;
    const dy = y2 - y1;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       角度
    */

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    /*
       線を作る
    */

    const winLine =
        document.createElement("div");


    winLine.className =
        "win-line";


    winLine.style.width =
        length + "px";


    winLine.style.left =
        x1 + "px";


    winLine.style.top =
        y1 + "px";


    /*
       ★ 回転はJS側
       アニメーションでは
       transformを触らない
    */

    winLine.style.transform =
        `rotate(${angle}deg)`;


    wrapper.appendChild(
        winLine
    );

}


/* =========================
   全マス埋まった？
========================= */

function isBoardFull(){

    for(
        let col = 0;
        col < COLS;
        col++
    ){

        if(
            board[0][col] === null
        ){

            return false;

        }

    }

    return true;

}


/* =========================
   ターン表示
========================= */

function updateTurn(){

    const player =
        players[currentPlayer];


    document
        .getElementById("turnDisplay")
        .textContent =
            player.name +
            "「" +
            player.symbol +
            "」の番";


    document
        .querySelectorAll(".player")
        .forEach(
            element =>
                element.classList.remove(
                    "active"
                )
        );


    const activePlayer =
        document.getElementById(
            "player" +
            currentPlayer
        );


    if(activePlayer){

        activePlayer.classList.add(
            "active"
        );

    }

}


/* =========================
   結果表示
========================= */

function showResult(message){

    document
        .getElementById("resultText")
        .textContent = message;


    document
        .getElementById("resultOverlay")
        .style.display = "flex";

}


/* =========================
   リセット
========================= */

function resetGame(){

    /*
       ★ チョーク線を消す
    */

    document
        .querySelectorAll(".win-line")
        .forEach(
            line => line.remove()
        );


    initGame();

}


/* =========================
   スタート
========================= */

initGame();

</script>

</body>
</html>
