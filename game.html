<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>4目落とし</title>


<!-- Supabase -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        "Arial Rounded MT Bold",
        "Hiragino Maru Gothic ProN",
        system-ui,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.04),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.03),
            transparent 25%
        ),
        #1f4d35;

    display:flex;
    justify-content:center;
    align-items:center;
}

body::before{
    content:"";

    position:fixed;
    inset:0;

    pointer-events:none;

    opacity:0.12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 7px,
            rgba(255,255,255,0.06) 8px
        );
}

.game-container{
    width:100%;
    max-width:760px;

    padding:18px;
}

h1{
    margin:0 0 5px;

    text-align:center;

    font-size:
        clamp(30px,8vw,52px);

    color:#fff;

    text-shadow:
        0 0 8px
        rgba(255,255,255,0.2);
}

.description{
    text-align:center;

    color:
        rgba(255,255,255,0.75);

    margin-bottom:10px;
}


/* =========================
   ルーム表示
========================= */

.room-info{
    text-align:center;

    margin-bottom:12px;

    color:
        rgba(255,255,255,0.75);

    font-size:14px;
}

#roomIdDisplay{
    font-weight:bold;
    color:#fff;
}


/* =========================
   接続状態
========================= */

.connection-status{
    text-align:center;

    margin-bottom:12px;

    font-size:14px;

    color:
        rgba(255,255,255,0.75);
}

#statusText{
    font-weight:bold;
}


/* =========================
   自分のプレイヤー表示
========================= */

.my-player{
    text-align:center;

    margin-bottom:12px;

    padding:8px;

    border:
        1px solid
        rgba(255,255,255,0.25);

    border-radius:10px;

    background:
        rgba(0,0,0,0.12);
}


/* =========================
   ターン
========================= */

.turn-box{
    padding:14px;

    margin-bottom:12px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-radius:12px;

    text-align:center;

    background:
        rgba(0,0,0,0.12);

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,0.15);
}

.turn-label{
    font-size:14px;

    color:
        rgba(255,255,255,0.65);
}

#turnDisplay{
    margin-top:3px;

    font-size:
        clamp(27px,8vw,42px);

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 10px
        rgba(255,255,255,0.35);
}


/* =========================
   プレイヤー
========================= */

.players{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:15px;
}

.player{
    padding:8px 4px;

    border:
        2px solid
        rgba(255,255,255,0.25);

    border-radius:10px;

    text-align:center;

    background:
        rgba(0,0,0,0.15);

    transition:0.2s;
}

.player-symbol{
    font-size:27px;

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 6px
        rgba(255,255,255,0.4);
}

.player.active{
    transform:scale(1.06);

    border-color:#fff;

    background:
        rgba(255,255,255,0.12);

    box-shadow:
        0 0 8px
        rgba(255,255,255,0.8),

        0 0 22px
        rgba(255,255,255,0.4);
}


/* =========================
   盤面
========================= */

.board-wrapper{
    position:relative;

    padding:11px;

    border:
        3px solid
        rgba(255,255,255,0.35);

    border-radius:8px;

    background:
        radial-gradient(
            circle at 50% 50%,
            #25583d,
            #173d2a
        );

    box-shadow:
        inset 0 0 25px
        rgba(0,0,0,0.4),

        0 8px 25px
        rgba(0,0,0,0.35);
}

.board{
    position:relative;

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    gap:6px;
}

.cell{
    aspect-ratio:1 / 1;

    display:flex;

    justify-content:center;
    align-items:center;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius:5px;

    cursor:pointer;

    user-select:none;

    color:#fff;

    font-size:
        clamp(24px,7vw,48px);

    font-weight:bold;

    text-shadow:
        0 0 5px
        rgba(255,255,255,0.45);

    transition:
        background 0.15s,
        transform 0.1s;
}

.cell:hover{
    background:
        rgba(255,255,255,0.07);
}

.cell:active{
    transform:scale(0.94);
}

.drop{
    animation:
        chalkDrop
        0.35s
        ease-out;
}

@keyframes chalkDrop{

    0%{
        transform:translateY(-45px);
        opacity:0;
    }

    70%{
        transform:translateY(5px);
    }

    100%{
        transform:translateY(0);
        opacity:1;
    }
}


/* =========================
   勝利した4個
========================= */

.winning-cell{
    animation:
        winningChalk
        0.45s
        ease-in-out
        infinite alternate;
}

@keyframes winningChalk{

    from{
        text-shadow:
            0 0 4px white;
    }

    to{
        text-shadow:
            0 0 15px white,
            0 0 25px
            rgba(255,255,255,0.7);
    }
}


/* =========================
   チョーク線
========================= */

.win-line{
    position:absolute;

    height:5px;

    background:#fff;

    border-radius:50%;

    transform-origin:left center;

    pointer-events:none;

    z-index:50;

    box-shadow:
        0 0 5px white,
        0 0 12px
        rgba(255,255,255,0.7);

    animation:
        chalkLine
        0.9s
        ease-out
        forwards;
}

.win-line::after{
    content:"";

    position:absolute;

    left:0;
    top:2px;

    width:100%;
    height:2px;

    background:
        rgba(255,255,255,0.45);
}

@keyframes chalkLine{

    from{
        clip-path:
            inset(0 100% 0 0);
    }

    to{
        clip-path:
            inset(0 0 0 0);
    }
}


/* =========================
   説明
========================= */

.hint{
    text-align:center;

    margin:13px 0;

    color:
        rgba(255,255,255,0.75);
}


/* =========================
   ボタン
========================= */

button{
    width:100%;

    height:50px;

    border:
        2px solid
        rgba(255,255,255,0.5);

    border-radius:10px;

    background:
        rgba(0,0,0,0.2);

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    font-family:inherit;
}

button:hover{
    background:
        rgba(255,255,255,0.12);
}

button:active{
    transform:scale(0.97);
}


/* =========================
   結果
========================= */

#resultOverlay{
    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    padding:20px;

    background:
        rgba(0,0,0,0.72);

    z-index:1000;
}

.result-box{
    width:100%;

    max-width:430px;

    padding:35px 25px;

    text-align:center;

    border:
        3px solid
        rgba(255,255,255,0.5);

    border-radius:15px;

    background:#1f4d35;

    box-shadow:
        0 0 30px
        rgba(255,255,255,0.2);

    animation:
        resultPop
        0.35s
        ease;
}

@keyframes resultPop{

    0%{
        transform:scale(0.5);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

#resultText{
    margin-bottom:25px;

    font-size:
        clamp(34px,10vw,52px);

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.5);
}


/* =========================
   スマホ
========================= */

@media(max-width:500px){

    .game-container{
        padding:10px;
    }

    .board-wrapper{
        padding:6px;
    }

    .board{
        gap:3px;
    }

    .players{
        gap:4px;
    }

    .player{
        font-size:12px;
    }

    .player-symbol{
        font-size:23px;
    }

}

</style>

<body>

<h1>🎮 4目落とし</h1>

<script>

/* =====================================================
   SUPABASE設定
===================================================== */


/*
   ★ ここはあなたがくれた情報

   REST APIの /rest/v1/ は付けない
*/

const SUPABASE_URL =
    "https://adjftdxlyvjlaumpejkh.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_qhq0mWdLBc__w6mBVn4-eA_LfOW7t-q";


const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ゲーム設定
===================================================== */

const ROWS = 6;

const COLS = 8;

const MAX_PLAYERS = 4;


/* =====================================================
   プレイヤー
===================================================== */

const players = [

    {
        name:"プレイヤー1",
        symbol:"〇"
    },

    {
        name:"プレイヤー2",
        symbol:"×"
    },

    {
        name:"プレイヤー3",
        symbol:"△"
    },

    {
        name:"プレイヤー4",
        symbol:"□"
    }

];


/* =====================================================
   URLからルームIDを取得
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


let roomId =
    urlParams.get("room");


/*
   ?room= がなかった場合
*/

if(!roomId){

    roomId =
        Math.floor(
            1000 +
            Math.random() * 9000
        ).toString();


    /*
       URLを書き換える

       例：
       game.html?room=5832
    */

    const newUrl =
        window.location.pathname +
        "?room=" +
        roomId;

    window.history.replaceState(
        {},
        "",
        newUrl
    );

}


/* =====================================================
   ルーム表示
===================================================== */

document
    .getElementById("roomIdDisplay")
    .textContent = roomId;


/* =====================================================
   自分を識別するID
===================================================== */

let clientId =
    localStorage.getItem(
        "4mokoroshi-client-id"
    );


if(!clientId){

    clientId =
        crypto.randomUUID();

    localStorage.setItem(
        "4mokoroshi-client-id",
        clientId
    );

}


/*
   同じブラウザで別ルームに入っても
   同じclientIdを使う
*/


/* =====================================================
   ゲーム状態
===================================================== */

let board = [];

let currentPlayer = 0;

let gameOver = false;

let myPlayer = -1;


/*
   盤面の更新番号

   古い通信で新しい盤面が
   上書きされないようにする
*/

let gameVersion = 0;


/* =====================================================
   Presence情報
===================================================== */

let channel = null;

let presencePlayers = [];


/*
   入室した時刻

   同時アクセス時の順番決定用
*/

const joinedAt =
    Date.now();


/* =====================================================
   ゲーム初期状態
===================================================== */

function createEmptyBoard(){

    const newBoard = [];

    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        newBoard[row] = [];

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            newBoard[row][col] = null;

        }

    }

    return newBoard;

}


/* =====================================================
   ゲーム初期化
===================================================== */

function initLocalGame(){

    board =
        createEmptyBoard();

    currentPlayer = 0;

    gameOver = false;

    gameVersion = 0;


    document
        .querySelectorAll(
            ".win-line"
        )
        .forEach(
            line => line.remove()
        );


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display = "none";


    createBoard();

    updateTurn();

}


/* =====================================================
   盤面作成
===================================================== */

function createBoard(){

    const boardElement =
        document.getElementById(
            "board"
        );


    boardElement.innerHTML = "";


    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "cell";


            cell.dataset.row =
                row;


            cell.dataset.col =
                col;


            cell.addEventListener(
                "click",
                () => {

                    dropPiece(col);

                }
            );


            boardElement.appendChild(
                cell
            );

        }

    }

}


/* =====================================================
   Supabase Realtime接続
===================================================== */

async function connectRoom(){

    setStatus(
        "接続中..."
    );


    /*
       ルームIDごとに別チャンネル
    */

    channel =
        supabase.channel(
            "4mokoroshi-room-" +
            roomId,

            {
                config:{
                    /*
                       今回は公開ルーム
                    */
                    presence:{
                        key:clientId
                    },

                    broadcast:{
                        self:false
                    }
                }
            }
        );


    /*
       Broadcast

       誰かが手を打った時
    */

    channel.on(
        "broadcast",
        {
            event:"game_move"
        },
        payload => {

            receiveMove(
                payload.payload
            );

        }
    );


    /*
       Broadcast

       ゲーム状態の同期
    */

    channel.on(
        "broadcast",
        {
            event:"game_state"
        },
        payload => {

            receiveGameState(
                payload.payload
            );

        }
    );


    /*
       リセット
    */

    channel.on(
        "broadcast",
        {
            event:"game_reset"
        },
        payload => {

            receiveReset(
                payload.payload
            );

        }
    );


    /*
       Presence

       プレイヤーが入った・抜けた
    */

    channel.on(
        "presence",
        {
            event:"sync"
        },
        () => {

            updatePresencePlayers();

        }
    );


    channel.on(
        "presence",
        {
            event:"join"
        },
        () => {

            updatePresencePlayers();

        }
    );


    channel.on(
        "presence",
        {
            event:"leave"
        },
        () => {

            updatePresencePlayers();

        }
    );


    /*
       接続
    */

    channel.subscribe(
        async status => {

            if(
                status === "SUBSCRIBED"
            ){

                setStatus(
                    "オンライン接続済み ✓"
                );


                /*
                   自分の存在を登録
                */

                await channel.track({

                    clientId:clientId,

                    joinedAt:joinedAt

                });


                /*
                   少し待ってから
                   プレイヤー番号を決める
                */

                setTimeout(
                    () => {

                        updatePresencePlayers();

                    },
                    300
                );

            }


            if(
                status === "CHANNEL_ERROR"
            ){

                setStatus(
                    "接続エラー"
                );

            }


            if(
                status === "TIMED_OUT"
            ){

                setStatus(
                    "接続タイムアウト"
                );

            }

        }
    );

}


/* =====================================================
   Presenceからプレイヤー順を作る
===================================================== */

function updatePresencePlayers(){

    if(!channel){
        return;
    }


    const state =
        channel.presenceState();


    const allPlayers = [];


    Object.keys(state)
        .forEach(key => {

            const entries =
                state[key];


            entries.forEach(entry => {

                if(
                    entry &&
                    entry.clientId
                ){

                    allPlayers.push({

                        clientId:
                            entry.clientId,

                        joinedAt:
                            Number(
                                entry.joinedAt
                            ) || 0

                    });

                }

            });

        });


    /*
       重複clientIdを削除
    */

    const unique =
        new Map();


    allPlayers.forEach(player => {

        unique.set(
            player.clientId,
            player
        );

    });


    /*
       入室時刻順

       同時ならclientId順
    */

    const sorted =
        Array.from(
            unique.values()
        ).sort(
            (a,b) => {

                if(
                    a.joinedAt !==
                    b.joinedAt
                ){

                    return (
                        a.joinedAt -
                        b.joinedAt
                    );

                }

                return a.clientId
                    .localeCompare(
                        b.clientId
                    );

            }
        );


    presencePlayers =
        sorted;


    /*
       自分の番号を探す
    */

    const index =
        sorted.findIndex(
            player =>
                player.clientId ===
                clientId
        );


    if(
        index >= 0 &&
        index < MAX_PLAYERS
    ){

        myPlayer = index;

    }
    else{

        myPlayer = -1;

    }


    updateMyPlayerDisplay();


    /*
       プレイヤー表示を更新
    */

    updatePlayerCards();


    /*
       新しく入った人がいる場合、
       現在のゲーム状態を同期
    */

    broadcastStateSoon();

}


/* =====================================================
   自分のプレイヤー表示
===================================================== */

function updateMyPlayerDisplay(){

    const display =
        document.getElementById(
            "myPlayerDisplay"
        );


    if(myPlayer >= 0){

        display.textContent =
            players[myPlayer].name +
            "「" +
            players[myPlayer].symbol +
            "」";

    }
    else{

        display.textContent =
            "観戦";

    }

}


/* =====================================================
   プレイヤーカード
===================================================== */

function updatePlayerCards(){

    for(
        let i = 0;
        i < MAX_PLAYERS;
        i++
    ){

        const card =
            document.getElementById(
                "player" + i
            );


        card.style.opacity =
            "0.55";

    }


    presencePlayers
        .slice(0,MAX_PLAYERS)
        .forEach(
            (player,index) => {

                const card =
                    document.getElementById(
                        "player" +
                        index
                    );


                card.style.opacity =
                    "1";

            }
        );


    /*
       現在のターン
    */

    document
        .querySelectorAll(
            ".player"
        )
        .forEach(
            element =>
                element.classList
                    .remove(
                        "active"
                    )
        );


    const active =
        document.getElementById(
            "player" +
            currentPlayer
        );


    if(active){

        active.classList.add(
            "active"
        );

    }

}


/* =====================================================
   状態同期を少し遅らせる
===================================================== */

let stateTimer = null;


function broadcastStateSoon(){

    clearTimeout(
        stateTimer
    );


    stateTimer =
        setTimeout(
            () => {

                broadcastGameState();

            },
            250
        );

}


/* =====================================================
   ゲーム状態送信
===================================================== */

async function broadcastGameState(){

    if(!channel){
        return;
    }


    /*
       自分の状態をPresenceにも入れる

       新規参加者が現在状態を
       取得できるようにする
    */

    await channel.track({

        clientId:clientId,

        joinedAt:joinedAt,

        gameState:{

            board:board,

            currentPlayer:
                currentPlayer,

            gameOver:
                gameOver,

            version:
                gameVersion

        }

    });


    /*
       Broadcastも送る
    */

    await channel.send({

        type:"broadcast",

        event:"game_state",

        payload:{

            board:board,

            currentPlayer:
                currentPlayer,

            gameOver:
                gameOver,

            version:
                gameVersion

        }

    });

}


/* =====================================================
   新しいゲーム状態を受信
===================================================== */

function receiveGameState(data){

    if(!data){
        return;
    }


    /*
       自分より古い状態なら無視
    */

    if(
        typeof data.version === "number" &&
        data.version < gameVersion
    ){

        return;

    }


    if(
        !Array.isArray(
            data.board
        )
    ){

        return;

    }


    board =
        data.board.map(
            row =>
                Array.isArray(row)
                    ? [...row]
                    : row
        );


    currentPlayer =
        Number(
            data.currentPlayer
        ) || 0;


    gameOver =
        Boolean(
            data.gameOver
        );


    gameVersion =
        Number(
            data.version
        ) || 0;


    renderBoard();

    updateTurn();


    /*
       終了済みゲームなら
       勝利線を再表示
    */

    if(gameOver){

        const winner =
            findWinnerFromBoard();


        if(winner){

            highlightWinningCells(
                winner.line
            );

            drawWinLine(
                winner.line
            );

        }

    }

}


/* =====================================================
   コマを落とす
===================================================== */

async function dropPiece(col){

    /*
       オンライン接続前
    */

    if(!channel){
        return;
    }


    /*
       観戦者
    */

    if(myPlayer < 0){

        alert(
            "このルームは4人参加中です。\n観戦モードです。"
        );

        return;

    }


    /*
       自分のターンではない
    */

    if(
        currentPlayer !== myPlayer
    ){

        return;

    }


    /*
       ゲーム終了
    */

    if(gameOver){
        return;
    }


    /*
       下から探す
    */

    let targetRow = -1;


    for(
        let row = ROWS - 1;
        row >= 0;
        row--
    ){

        if(
            board[row][col] === null
        ){

            targetRow = row;

            break;

        }

    }


    /*
       列がいっぱい
    */

    if(
        targetRow === -1
    ){

        return;

    }


    /*
       自分のコマ
    */

    board[targetRow][col] =
        myPlayer;


    /*
       勝利判定
    */

    const winningLine =
        findWinningLine(
            targetRow,
            col,
            myPlayer
        );


    let nextPlayer =
        currentPlayer;


    let nextGameOver =
        false;


    if(winningLine){

        nextGameOver = true;

    }
    else if(
        isBoardFull()
    ){

        nextGameOver = true;

    }
    else{

        nextPlayer =
            (
                currentPlayer + 1
            ) %
            MAX_PLAYERS;

    }


    /*
       バージョンアップ
    */

    gameVersion++;


    currentPlayer =
        nextPlayer;


    gameOver =
        nextGameOver;


    /*
       自分の画面を更新
    */

    renderBoard();

    updateTurn();


    /*
       勝利演出
    */

    if(winningLine){

        playWinAnimation(
            winningLine,
            myPlayer
        );

    }


    /*
       引き分け
    */

    if(
        !winningLine &&
        isBoardFull()
    ){

        setTimeout(
            () => {

                showResult(
                    "引き分け！"
                );

            },
            300
        );

    }


    /*
       他の全員へ送信
    */

    await channel.send({

        type:"broadcast",

        event:"game_move",

        payload:{

            row:
                targetRow,

            col:
                col,

            player:
                myPlayer,

            currentPlayer:
                currentPlayer,

            gameOver:
                gameOver,

            version:
                gameVersion,

            winningLine:
                winningLine

        }

    });


    /*
       新規参加者用に状態保存
    */

    broadcastStateSoon();

}


/* =====================================================
   他のプレイヤーの手を受信
===================================================== */

function receiveMove(data){

    if(!data){
        return;
    }


    /*
       古い通信
    */

    if(
        typeof data.version === "number" &&
        data.version <= gameVersion
    ){

        return;

    }


    const row =
        Number(data.row);

    const col =
        Number(data.col);

    const player =
        Number(data.player);


    if(
        row < 0 ||
        row >= ROWS ||
        col < 0 ||
        col >= COLS
    ){

        return;

    }


    if(
        player < 0 ||
        player >= MAX_PLAYERS
    ){

        return;

    }


    /*
       すでに置かれていたら無視
    */

    if(
        board[row][col] !== null
    ){

        return;

    }


    board[row][col] =
        player;


    currentPlayer =
        Number(
            data.currentPlayer
        );


    gameOver =
        Boolean(
            data.gameOver
        );


    gameVersion =
        Number(
            data.version
        ) || (
            gameVersion + 1
        );


    renderBoard();

    updateTurn();


    /*
       勝利
    */

    if(
        data.winningLine
    ){

        playWinAnimation(
            data.winningLine,
            player
        );

    }
    else if(
        gameOver
    ){

        setTimeout(
            () => {

                showResult(
                    "引き分け！"
                );

            },
            300
        );

    }


    /*
       新規参加者用に状態を更新
    */

    broadcastStateSoon();

}


/* =====================================================
   勝利演出
===================================================== */

function playWinAnimation(
    winningLine,
    winner
){

    highlightWinningCells(
        winningLine
    );


    drawWinLine(
        winningLine
    );


    /*
       線が描き終わってから表示
    */

    setTimeout(
        () => {

            showResult(
                players[winner]
                    .symbol +
                "の勝ち！"
            );

        },
        950
    );

}


/* =====================================================
   盤面表示
===================================================== */

function renderBoard(){

    const cells =
        document.querySelectorAll(
            ".cell"
        );


    cells.forEach(cell => {

        const row =
            Number(
                cell.dataset.row
            );


        const col =
            Number(
                cell.dataset.col
            );


        cell.textContent = "";

        cell.className =
            "cell";


        if(
            board[row][col] !== null
        ){

            const player =
                players[
                    board[row][col]
                ];


            cell.textContent =
                player.symbol;


            cell.classList.add(
                "drop"
            );

        }

    });

}


/* =====================================================
   勝利判定
===================================================== */

function findWinningLine(
    row,
    col,
    player
){

    const directions = [

        [0,1],

        [1,0],

        [1,1],

        [1,-1]

    ];


    for(
        const [
            dr,
            dc
        ]
        of directions
    ){

        const line =
            getLineBothWays(
                row,
                col,
                dr,
                dc,
                player
            );


        if(
            line.length >= 4
        ){

            return chooseFour(
                line,
                row,
                col
            );

        }

    }


    return null;

}


/* =====================================================
   両方向検索
===================================================== */

function getLineBothWays(
    row,
    col,
    dr,
    dc,
    player
){

    const line = [];


    let r =
        row - dr;

    let c =
        col - dc;


    while(
        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player
    ){

        line.unshift({

            row:r,

            col:c

        });


        r -= dr;

        c -= dc;

    }


    line.push({

        row:row,

        col:col

    });


    r =
        row + dr;

    c =
        col + dc;


    while(
        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player
    ){

        line.push({

            row:r,

            col:c

        });


        r += dr;

        c += dc;

    }


    return line;

}


/* =====================================================
   4個を選ぶ
===================================================== */

function chooseFour(
    line,
    row,
    col
){

    if(
        line.length === 4
    ){

        return line;

    }


    const index =
        line.findIndex(
            cell =>
                cell.row === row &&
                cell.col === col
        );


    const start =
        Math.max(
            0,
            Math.min(
                index - 3,
                line.length - 4
            )
        );


    return line.slice(
        start,
        start + 4
    );

}


/* =====================================================
   勝利マスを光らせる
===================================================== */

function highlightWinningCells(
    line
){

    line.forEach(
        position => {

            const cell =
                document.querySelector(
                    `.cell[data-row="${position.row}"][data-col="${position.col}"]`
                );


            if(cell){

                cell.classList.add(
                    "winning-cell"
                );

            }

        }
    );

}


/* =====================================================
   チョーク線
===================================================== */

function drawWinLine(line){

    /*
       同じ線が残っていたら消す
    */

    document
        .querySelectorAll(
            ".win-line"
        )
        .forEach(
            line =>
                line.remove()
        );


    const wrapper =
        document.getElementById(
            "boardWrapper"
        );


    const firstCell =
        document.querySelector(
            `.cell[data-row="${line[0].row}"][data-col="${line[0].col}"]`
        );


    const lastCell =
        document.querySelector(
            `.cell[data-row="${line[3].row}"][data-col="${line[3].col}"]`
        );


    if(
        !firstCell ||
        !lastCell
    ){

        return;

    }


    const wrapperRect =
        wrapper.getBoundingClientRect();


    const firstRect =
        firstCell.getBoundingClientRect();


    const lastRect =
        lastCell.getBoundingClientRect();


    const x1 =
        firstRect.left -
        wrapperRect.left +
        firstRect.width / 2;


    const y1 =
        firstRect.top -
        wrapperRect.top +
        firstRect.height / 2;


    const x2 =
        lastRect.left -
        wrapperRect.left +
        lastRect.width / 2;


    const y2 =
        lastRect.top -
        wrapperRect.top +
        lastRect.height / 2;


    const dx =
        x2 - x1;


    const dy =
        y2 - y1;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    const winLine =
        document.createElement(
            "div"
        );


    winLine.className =
        "win-line";


    winLine.style.width =
        length + "px";


    winLine.style.left =
        x1 + "px";


    winLine.style.top =
        y1 + "px";


    winLine.style.transform =
        `rotate(${angle}deg)`;


    wrapper.appendChild(
        winLine
    );

}


/* =====================================================
   盤面全部埋まった？
===================================================== */

function isBoardFull(){

    for(
        let col = 0;
        col < COLS;
        col++
    ){

        if(
            board[0][col] === null
        ){

            return false;

        }

    }

    return true;

}


/* =====================================================
   現在の盤面から勝者を探す
===================================================== */

function findWinnerFromBoard(){

    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            if(
                board[row][col] === null
            ){

                continue;

            }


            const player =
                board[row][col];


            const line =
                findWinningLine(
                    row,
                    col,
                    player
                );


            if(line){

                return {

                    player:player,

                    line:line

                };

            }

        }

    }


    return null;

}


/* =====================================================
   ターン表示
===================================================== */

function updateTurn(){

    const player =
        players[currentPlayer];


    const display =
        document.getElementById(
            "turnDisplay"
        );


    if(gameOver){

        display.textContent =
            "ゲーム終了";

    }
    else{

        display.textContent =
            player.name +
            "「" +
            player.symbol +
            "」の番";

    }


    updatePlayerCards();

}


/* =====================================================
   接続状態
===================================================== */

function setStatus(text){

    document
        .getElementById(
            "statusText"
        )
        .textContent = text;

}


/* =====================================================
   結果表示
===================================================== */

function showResult(message){

    document
        .getElementById(
            "resultText"
        )
        .textContent =
            message;


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display =
            "flex";

}


/* =====================================================
   リセット
===================================================== */

async function resetGame(){

    /*
       自分がP1だけリセット可能
    */

    if(
        myPlayer !== 0
    ){

        alert(
            "ゲームのリセットは\nプレイヤー1が行えます。"
        );

        return;

    }


    board =
        createEmptyBoard();


    currentPlayer = 0;

    gameOver = false;

    gameVersion++;


    document
        .querySelectorAll(
            ".win-line"
        )
        .forEach(
            line =>
                line.remove()
        );


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display =
            "none";


    createBoard();

    updateTurn();


    /*
       全員へリセット通知
    */

    if(channel){

        await channel.send({

            type:"broadcast",

            event:"game_reset",

            payload:{

                version:
                    gameVersion

            }

        });


        broadcastStateSoon();

    }

}


/* =====================================================
   リセット受信
===================================================== */

function receiveReset(data){

    if(!data){
        return;
    }


    board =
        createEmptyBoard();


    currentPlayer = 0;

    gameOver = false;


    gameVersion =
        Number(
            data.version
        ) || (
            gameVersion + 1
        );


    document
        .querySelectorAll(
            ".win-line"
        )
        .forEach(
            line =>
                line.remove()
        );


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display =
            "none";


    createBoard();

    updateTurn();

}


/* =====================================================
   起動
===================================================== */

initLocalGame();


connectRoom();

</script>
