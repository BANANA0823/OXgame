<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>4目落とし</title>

<style>

/* =====================================
   基本
===================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;

    font-family:
        "Arial Rounded MT Bold",
        "Hiragino Maru Gothic ProN",
        system-ui,
        sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 20% 20%,
            rgba(255,255,255,0.04),
            transparent 25%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.03),
            transparent 25%
        ),
        #1f4d35;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow-x:hidden;
}


/* =====================================
   黒板の質感
===================================== */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    opacity:0.12;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent,
            transparent 7px,
            rgba(255,255,255,0.06) 8px
        );

    z-index:-1;

}


/* =====================================
   全体
===================================== */

.game-container{

    width:100%;

    max-width:760px;

    padding:18px;

}


/* =====================================
   タイトル
===================================== */

h1{

    margin:
        0 0 5px;

    text-align:center;

    font-size:
        clamp(
            30px,
            8vw,
            52px
        );

    color:#fff;

    text-shadow:
        2px 2px 0
        rgba(255,255,255,0.15),
        0 0 8px
        rgba(255,255,255,0.15);

}


.description{

    text-align:center;

    color:
        rgba(255,255,255,0.75);

    margin-bottom:15px;

}


/* =====================================
   ターン表示
===================================== */

.turn-box{

    padding:14px;

    margin-bottom:12px;

    border:
        2px solid
        rgba(255,255,255,0.35);

    border-radius:12px;

    text-align:center;

    background:
        rgba(0,0,0,0.12);

    box-shadow:
        inset 0 0 15px
        rgba(0,0,0,0.15);

}


.turn-label{

    font-size:14px;

    color:
        rgba(255,255,255,0.65);

}


#turnDisplay{

    margin-top:3px;

    font-size:
        clamp(
            27px,
            8vw,
            42px
        );

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 10px
        rgba(255,255,255,0.35);

}


/* =====================================
   プレイヤー一覧
===================================== */

.players{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

    margin-bottom:15px;

}


.player{

    padding:8px 4px;

    border:
        2px solid
        rgba(255,255,255,0.25);

    border-radius:10px;

    text-align:center;

    background:
        rgba(0,0,0,0.15);

    color:#fff;

    transition:
        0.2s;

}


.player-symbol{

    font-size:27px;

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 5px
        rgba(255,255,255,0.4);

}


/* =====================================
   ✨ 今のプレイヤー
===================================== */

.player.active{

    transform:
        scale(1.06);

    border-color:#fff;

    background:
        rgba(255,255,255,0.12);

    box-shadow:

        0 0 8px
        rgba(255,255,255,0.8),

        0 0 22px
        rgba(255,255,255,0.4);

}


/* =====================================
   黒板のゲーム盤
===================================== */

.board-wrapper{

    position:relative;

    padding:11px;

    border:
        3px solid
        rgba(255,255,255,0.35);

    border-radius:8px;

    background:

        radial-gradient(
            circle at 50% 50%,
            #25583d,
            #173d2a
        );

    box-shadow:

        inset 0 0 25px
        rgba(0,0,0,0.4),

        0 8px 25px
        rgba(0,0,0,0.35);

}


/* =====================================
   盤面
===================================== */

.board{

    position:relative;

    display:grid;

    grid-template-columns:
        repeat(8,1fr);

    gap:6px;

}


/* =====================================
   マス
===================================== */

.cell{

    aspect-ratio:1 / 1;

    display:flex;

    justify-content:center;

    align-items:center;

    border:
        1px solid
        rgba(255,255,255,0.15);

    border-radius:5px;

    cursor:pointer;

    user-select:none;

    color:#fff;

    font-size:
        clamp(
            24px,
            7vw,
            48px
        );

    font-weight:bold;

    text-shadow:
        0 0 5px
        rgba(255,255,255,0.45);

    transition:
        background 0.15s,
        transform 0.1s;

}


.cell:hover{

    background:
        rgba(255,255,255,0.07);

}


.cell:active{

    transform:
        scale(0.94);

}


/* =====================================
   ⚪ 記号は全部白
===================================== */

.circle,
.cross,
.triangle,
.square{

    color:#fff !important;

}


/* =====================================
   落下アニメーション
===================================== */

.drop{

    animation:
        chalkDrop
        0.35s
        ease-out;

}


@keyframes chalkDrop{

    0%{

        transform:
            translateY(-45px);

        opacity:0;

    }

    70%{

        transform:
            translateY(5px);

    }

    100%{

        transform:
            translateY(0);

        opacity:1;

    }

}


/* =====================================
   🏆 勝利したマス
===================================== */

.winning-cell{

    animation:
        winningChalk
        0.7s
        ease-in-out
        infinite alternate;

}


@keyframes winningChalk{

    from{

        text-shadow:
            0 0 4px white;

        transform:
            scale(1);

    }

    to{

        text-shadow:
            0 0 18px white,
            0 0 30px
            rgba(255,255,255,0.7);

        transform:
            scale(1.08);

    }

}


/* =====================================
   🖍️ 勝利ライン
===================================== */

.win-line{

    position:absolute;

    height:5px;

    background:#fff;

    border-radius:50%;

    transform-origin:left center;

    pointer-events:none;

    z-index:20;

    box-shadow:

        0 0 5px white,

        0 0 12px
        rgba(255,255,255,0.7);

    animation:
        chalkLine
        0.5s
        ease-out;

}


/* チョーク線っぽく少し不規則 */

.win-line::after{

    content:"";

    position:absolute;

    left:0;

    top:2px;

    width:100%;

    height:2px;

    background:
        rgba(255,255,255,0.45);

    transform:
        rotate(1deg);

}


@keyframes chalkLine{

    from{

        transform:
            scaleX(0);

        opacity:0;

    }

    to{

        opacity:1;

    }

}


/* =====================================
   説明
===================================== */

.hint{

    text-align:center;

    margin:13px 0;

    color:
        rgba(255,255,255,0.75);

}


/* =====================================
   ボタン
===================================== */

button{

    width:100%;

    height:50px;

    border:

        2px solid
        rgba(255,255,255,0.5);

    border-radius:10px;

    background:
        rgba(0,0,0,0.2);

    color:#fff;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    font-family:inherit;

    transition:
        0.15s;

}


button:hover{

    background:
        rgba(255,255,255,0.12);

}


button:active{

    transform:
        scale(0.97);

}


/* =====================================
   勝利画面
===================================== */

#resultOverlay{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:
        rgba(0,0,0,0.72);

    z-index:1000;

}


.result-box{

    width:100%;

    max-width:430px;

    padding:35px 25px;

    text-align:center;

    border:
        3px solid
        rgba(255,255,255,0.5);

    border-radius:15px;

    background:#1f4d35;

    box-shadow:
        0 0 30px
        rgba(255,255,255,0.2);

    animation:
        resultPop
        0.35s
        ease;

}


@keyframes resultPop{

    0%{

        transform:
            scale(0.5);

        opacity:0;

    }

    100%{

        transform:
            scale(1);

        opacity:1;

    }

}


#resultText{

    margin-bottom:25px;

    font-size:
        clamp(
            34px,
            10vw,
            52px
        );

    font-weight:bold;

    color:#fff;

    text-shadow:
        0 0 12px
        rgba(255,255,255,0.5);

}


.draw-message{

    color:#fff;

}


/* =====================================
   スマホ
===================================== */

@media(max-width:500px){

    .game-container{

        padding:10px;

    }


    .board-wrapper{

        padding:6px;

    }


    .board{

        gap:3px;

    }


    .players{

        gap:4px;

    }


    .player{

        font-size:12px;

    }


    .player-symbol{

        font-size:23px;

    }

}

</style>
</head>


<body>


<div class="game-container">


    <h1>🎮 4目落とし</h1>


    <div class="description">
        黒板で遊ぶ、4人用ゲーム
    </div>


    <!-- =====================
         ターン
    ====================== -->

    <div class="turn-box">

        <div class="turn-label">
            現在のターン
        </div>

        <div id="turnDisplay">
            プレイヤー1「〇」の番
        </div>

    </div>


    <!-- =====================
         プレイヤー
    ====================== -->

    <div class="players">


        <div
            class="player"
            id="player0"
        >

            <div class="player-symbol">
                〇
            </div>

            P1

        </div>


        <div
            class="player"
            id="player1"
        >

            <div class="player-symbol">
                ×
            </div>

            P2

        </div>


        <div
            class="player"
            id="player2"
        >

            <div class="player-symbol">
                △
            </div>

            P3

        </div>


        <div
            class="player"
            id="player3"
        >

            <div class="player-symbol">
                □
            </div>

            P4

        </div>


    </div>


    <!-- =====================
         ゲーム盤
    ====================== -->

    <div
        class="board-wrapper"
        id="boardWrapper"
    >

        <div
            id="board"
            class="board"
        ></div>

    </div>


    <div class="hint">
        👆 入れたい列をタップ！
    </div>


    <button onclick="resetGame()">
        🔄 ゲームをリセット
    </button>


</div>


<!-- =====================
     勝利画面
====================== -->

<div id="resultOverlay">

    <div class="result-box">

        <div id="resultText"></div>

        <button onclick="resetGame()">
            🔄 もう一回遊ぶ
        </button>

    </div>

</div>


<script>

/* =====================================
   🎮 設定
===================================== */

const ROWS = 6;
const COLS = 8;


/* =====================================
   👥 プレイヤー
===================================== */

const players = [

    {
        name:"プレイヤー1",
        symbol:"〇"
    },

    {
        name:"プレイヤー2",
        symbol:"×"
    },

    {
        name:"プレイヤー3",
        symbol:"△"
    },

    {
        name:"プレイヤー4",
        symbol:"□"
    }

];


/* =====================================
   ゲームデータ
===================================== */

let board = [];

let currentPlayer = 0;

let gameOver = false;


/* =====================================
   🚀 初期化
===================================== */

function initGame(){

    board = [];

    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        board[row] = [];

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            board[row][col] = null;

        }

    }


    currentPlayer = 0;

    gameOver = false;


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display = "none";


    createBoard();

    updateTurn();

}


/* =====================================
   🧱 盤面作成
===================================== */

function createBoard(){

    const boardElement =
        document.getElementById(
            "board"
        );


    boardElement.innerHTML = "";


    for(
        let row = 0;
        row < ROWS;
        row++
    ){

        for(
            let col = 0;
            col < COLS;
            col++
        ){

            const cell =
                document.createElement(
                    "div"
                );


            cell.className = "cell";


            cell.dataset.row = row;

            cell.dataset.col = col;


            cell.addEventListener(
                "click",
                function(){

                    dropPiece(col);

                }
            );


            boardElement.appendChild(
                cell
            );

        }

    }

}


/* =====================================
   ⬇️ コマを落とす
===================================== */

function dropPiece(col){

    if(gameOver){

        return;

    }


    let targetRow = -1;


    /*
       下から空きを探す
    */

    for(
        let row = ROWS - 1;
        row >= 0;
        row--
    ){

        if(
            board[row][col] === null
        ){

            targetRow = row;

            break;

        }

    }


    /*
       列がいっぱい
    */

    if(targetRow === -1){

        return;

    }


    /*
       コマ配置
    */

    board[targetRow][col] =
        currentPlayer;


    renderBoard();


    /*
       勝利判定
    */

    const winningLine =
        findWinningLine(
            targetRow,
            col,
            currentPlayer
        );


    if(winningLine){

        highlightWinningCells(
            winningLine
        );


        drawWinLine(
            winningLine
        );


        endGame(
            players[currentPlayer]
                .symbol +
            "の勝ち！"
        );


        return;

    }


    /*
       引き分け
    */

    if(isBoardFull()){

        endGame(
            "引き分け！"
        );

        return;

    }


    /*
       次のプレイヤー
    */

    currentPlayer++;


    if(
        currentPlayer >=
        players.length
    ){

        currentPlayer = 0;

    }


    updateTurn();

}


/* =====================================
   🖥️ 盤面表示
===================================== */

function renderBoard(){

    const cells =
        document.querySelectorAll(
            ".cell"
        );


    cells.forEach(
        function(cell){

            const row =
                Number(
                    cell.dataset.row
                );

            const col =
                Number(
                    cell.dataset.col
                );


            cell.textContent = "";

            cell.className = "cell";


            if(
                board[row][col] !== null
            ){

                cell.textContent =
                    players[
                        board[row][col]
                    ].symbol;


                cell.classList.add(
                    "drop"
                );

            }

        }
    );

}


/* =====================================
   🏆 勝利ラインを探す
===================================== */

function findWinningLine(
    row,
    col,
    player
){

    /*
       横
    */

    let line =
        getLine(
            row,
            col,
            0,
            1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       縦
    */

    line =
        getLine(
            row,
            col,
            1,
            0,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       斜め ↘
    */

    line =
        getLineBothWays(
            row,
            col,
            1,
            1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    /*
       斜め ↙
    */

    line =
        getLineBothWays(
            row,
            col,
            1,
            -1,
            player
        );


    if(line.length >= 4){

        return chooseFour(
            line,
            row,
            col
        );

    }


    return null;

}


/* =====================================
   🔢 片方向
===================================== */

function getLine(
    row,
    col,
    dr,
    dc,
    player
){

    const line = [

        {
            row:row,
            col:col
        }

    ];


    let r =
        row + dr;

    let c =
        col + dc;


    while(

        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player

    ){

        line.push({
            row:r,
            col:c
        });


        r += dr;
        c += dc;

    }


    return line;

}


/* =====================================
   🔢 両方向
===================================== */

function getLineBothWays(
    row,
    col,
    dr,
    dc,
    player
){

    const line = [];


    /*
       逆方向
    */

    let r =
        row - dr;

    let c =
        col - dc;


    while(

        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player

    ){

        line.unshift({

            row:r,
            col:c

        });


        r -= dr;
        c -= dc;

    }


    /*
       自分
    */

    line.push({

        row:row,
        col:col

    });


    /*
       正方向
    */

    r =
        row + dr;

    c =
        col + dc;


    while(

        r >= 0 &&
        r < ROWS &&
        c >= 0 &&
        c < COLS &&
        board[r][c] === player

    ){

        line.push({

            row:r,
            col:c

        });


        r += dr;
        c += dc;

    }


    return line;

}


/* =====================================
   🎯 4個だけ選ぶ
===================================== */

function chooseFour(
    line,
    row,
    col
){

    /*
       4個以上つながっている場合、
       置いたコマを含む4個を優先
    */

    if(line.length === 4){

        return line;

    }


    const index =
        line.findIndex(
            cell =>
                cell.row === row &&
                cell.col === col
        );


    let start =
        Math.max(
            0,
            Math.min(
                index - 3,
                line.length - 4
            )
        );


    return line.slice(
        start,
        start + 4
    );

}


/* =====================================
   ✨ 勝った4マスを光らせる
===================================== */

function highlightWinningCells(
    line
){

    line.forEach(
        function(position){

            const cell =
                document.querySelector(
                    `.cell[data-row="${position.row}"][data-col="${position.col}"]`
                );


            if(cell){

                cell.classList.add(
                    "winning-cell"
                );

            }

        }
    );

}


/* =====================================
   🖍️ 4つを線で結ぶ
===================================== */

function drawWinLine(line){

    const wrapper =
        document.getElementById(
            "boardWrapper"
        );


    const firstCell =
        document.querySelector(
            `.cell[data-row="${line[0].row}"][data-col="${line[0].col}"]`
        );


    const lastCell =
        document.querySelector(
            `.cell[data-row="${line[3].row}"][data-col="${line[3].col}"]`
        );


    if(
        !firstCell ||
        !lastCell
    ){

        return;

    }


    const wrapperRect =
        wrapper.getBoundingClientRect();


    const firstRect =
        firstCell.getBoundingClientRect();


    const lastRect =
        lastCell.getBoundingClientRect();


    /*
       それぞれのマスの中心
    */

    const x1 =
        firstRect.left -
        wrapperRect.left +
        firstRect.width / 2;


    const y1 =
        firstRect.top -
        wrapperRect.top +
        firstRect.height / 2;


    const x2 =
        lastRect.left -
        wrapperRect.left +
        lastRect.width / 2;


    const y2 =
        lastRect.top -
        wrapperRect.top +
        lastRect.height / 2;


    /*
       距離
    */

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;


    const length =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       角度
    */

    const angle =
        Math.atan2(
            dy,
            dx
        ) *
        180 /
        Math.PI;


    /*
       線を作る
    */

    const lineElement =
        document.createElement(
            "div"
        );


    lineElement.className =
        "win-line";


    lineElement.style.width =
        length + "px";


    lineElement.style.left =
        x1 + "px";


    lineElement.style.top =
        y1 + "px";


    lineElement.style.transform =
        `rotate(${angle}deg)`;


    wrapper.appendChild(
        lineElement
    );

}


/* =====================================
   📦 全マス埋まった？
===================================== */

function isBoardFull(){

    for(
        let col = 0;
        col < COLS;
        col++
    ){

        if(
            board[0][col] === null
        ){

            return false;

        }

    }


    return true;

}


/* =====================================
   👤 ターン表示
===================================== */

function updateTurn(){

    const player =
        players[currentPlayer];


    const display =
        document.getElementById(
            "turnDisplay"
        );


    display.textContent =
        player.name +
        "「" +
        player.symbol +
        "」の番";


    /*
       全員の光を消す
    */

    document
        .querySelectorAll(
            ".player"
        )
        .forEach(
            function(element){

                element.classList.remove(
                    "active"
                );

            }
        );


    /*
       今の人だけ光らせる
    */

    document
        .getElementById(
            "player" +
            currentPlayer
        )
        ?.classList.add(
            "active"
        );

}


/* =====================================
   🏆 終了
===================================== */

function endGame(message){

    gameOver = true;


    const resultText =
        document.getElementById(
            "resultText"
        );


    resultText.textContent =
        message;


    document
        .getElementById(
            "resultOverlay"
        )
        .style.display =
            "flex";

}


/* =====================================
   🔄 リセット
===================================== */

function resetGame(){

    initGame();

}


/* =====================================
   🚀 スタート
===================================== */

initGame();

</script>

</body>
</html>
