<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gravity Four</title>
<style>
  body { background:#1f4d35; color:#fff; font-family:sans-serif; text-align:center; padding:10px; margin:0; }
  .board { display:grid; grid-template-columns:repeat(8,1fr); gap:5px; max-width:400px; margin:15px auto; }
  .cell { aspect-ratio:1; background:rgba(0,0,0,0.2); border:1px dashed rgba(255,255,255,0.3); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:bold; cursor:pointer; }
  .players { display:flex; justify-content:center; gap:10px; margin-bottom:15px; }
  .player { padding:5px 10px; background:rgba(0,0,0,0.3); border-radius:5px; border:2px solid transparent; font-size:12px; }
  .player.active { border-color:#ffeb3b; background:rgba(255,255,255,0.1); }
  #login { position:fixed; inset:0; background:#1f4d35; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:9; }
  input, button { padding:10px; font-size:16px; border-radius:5px; border:none; margin:5px; }
  button { background:#4caf50; color:#fff; font-weight:bold; cursor:pointer; }
</style>
</head>
<body>

<!-- 名前入力 -->
<div id="login">
  <h2>🌌 Gravity Four</h2>
  <p>ゲームでつかう なまえを入力してね</p>
  <input type="text" id="nameIn" placeholder="なまえ（最大8文字）" maxlength="8">
  <button onclick="start()">ゲームにさんか</button>
</div>

<!-- ゲーム画面 -->
<h1>🌌 Gravity Four</h1>
<h3 id="status">なまえを入力してね</h3>

<div class="players">
  <div class="player" id="p0">〇 <span id="n0">P1</span></div>
  <div class="player" id="p1">× <span id="n1">P2</span></div>
  <div class="player" id="p2">△ <span id="n2">P3</span></div>
  <div class="player" id="p3">□ <span id="n3">P4</span></div>
</div>

<div class="board" id="board"></div>
<button onclick="reset()">🔄 リセット</button>

<script>
const ROWS=6, COLS=8;
const info = [{s:'〇'}, {s:'×'}, {s:'△'}, {s:'□'}];
let board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
let cur=0, active=true;
let roster = {0:"プレイヤー", 1:"CPU-A", 2:"CPU-B", 3:"CPU-C"};

// 盤面作り
const bEl = document.getElementById('board');
for(let r=0; r<ROWS; r++) {
  for(let c=0; c<COLS; c++) {
    let e = document.createElement('div');
    e.className = 'cell';
    e.onclick = () => clickCol(c);
    e.id = `c-${r}-${c}`;
    bEl.appendChild(e);
  }
}

function start() {
  let name = document.getElementById('nameIn').value.trim() || "プレイヤー";
  document.getElementById('login').style.display = 'none';
  roster[0] = name;
  draw();
}

function draw() {
  for(let r=0; r<ROWS; r++) {
    for(let c=0; c<COLS; c++) {
      let cell = document.getElementById(`c-${r}-${c}`);
      cell.innerText = board[r][c] !== null ? info[board[r][c]].s : "";
    }
  }
  for(let i=0; i<4; i++) {
    document.getElementById('n'+i).innerText = roster[i];
    document.getElementById('p'+i).className = "player" + (cur===i ? " active" : "");
  }
  document.getElementById('status').innerText = active ? `【${roster[cur]}】のばん！` : "ゲーム終了！";
}

function clickCol(c) {
  if(!active || cur !== 0) return; // 自分の番（0番）じゃないときは押せない
  drop(c);
}

function drop(c) {
  for(let r=ROWS-1; r>=0; r--) {
    if(board[r][c] === null) {
      board[r][c] = cur;
      draw();
      
      if(win(r, c, cur)) { 
        active=false; 
        setTimeout(() => { alert(roster[board[r][c]]+"の勝ち！"); draw(); }, 10);
        return; 
      }
      
      cur = (cur + 1) % 4;
      draw();
      
      if(active && cur !== 0) {
        setTimeout(cpuMove, 600);
      }
      return;
    }
  }
}

function cpuMove() {
  if(!active) return;
  let ok = [];
  for(let c=0; c<COLS; c++) { 
    if(board[0][c] === null) ok.push(c); 
  }
  if(ok.length > 0) {
    let targetCol = ok[Math.floor(Math.random()*ok.length)];
    drop(targetCol);
  }
}

function win(r, c, p) {
  let d = [[0,1],[1,0],[1,1],[1,-1]];
  for(let [dr,dc] of d) {
    let ct = 1;
    for(let i=1; i<4; i++) { if(board[r+dr*i]?.[c+dc*i]===p) ct++; else break; }
    for(let i=1; i<4; i++) { if(board[r-dr*i]?.[c-dc*i]===p) ct++; else break; }
    if(ct>=4) return true;
  }
  return false;
}

function reset() {
  board = Array.from({length:ROWS},()=>Array(COLS).fill(null));
  cur=0; active=true;
  draw();
}
</script>
</body>
</html>
