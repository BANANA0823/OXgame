<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>4目落とし - オンライン対戦</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,rgba(255,255,255,.04),transparent 25%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.03),transparent 25%),#1f4d35;display:flex;justify-content:center;align-items:center}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:repeating-linear-gradient(0deg,transparent,transparent 7px,rgba(255,255,255,.06) 8px)}.game-container{width:100%;max-width:760px;padding:18px}h1{margin:0 0 5px;text-align:center;font-size:clamp(30px,8vw,52px);text-shadow:0 0 8px rgba(255,255,255,.2)}.description,.room-status{text-align:center;color:rgba(255,255,255,.75)}.room-status{font-size:14px;margin:8px 0 12px}.turn-box{padding:14px;margin-bottom:12px;border:2px solid rgba(255,255,255,.35);border-radius:12px;text-align:center;background:rgba(0,0,0,.12)}.turn-label{font-size:14px;color:rgba(255,255,255,.65)}#turnDisplay{margin-top:3px;font-size:clamp(27px,8vw,42px);font-weight:bold;text-shadow:0 0 10px rgba(255,255,255,.35)}.players{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:15px}.player{padding:8px 4px;border:2px solid rgba(255,255,255,.25);border-radius:10px;text-align:center;background:rgba(0,0,0,.15);transition:.2s}.player-symbol{font-size:27px;font-weight:bold;text-shadow:0 0 6px rgba(255,255,255,.4)}.player.active{transform:scale(1.06);border-color:#fff;background:rgba(255,255,255,.12);box-shadow:0 0 8px #fff,0 0 22px rgba(255,255,255,.4)}.player.me{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}.board-wrapper{position:relative;padding:11px;border:3px solid rgba(255,255,255,.35);border-radius:8px;background:radial-gradient(circle,#25583d,#173d2a);box-shadow:inset 0 0 25px rgba(0,0,0,.4),0 8px 25px rgba(0,0,0,.35)}.board{position:relative;display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.cell{aspect-ratio:1;display:flex;justify-content:center;align-items:center;border:1px solid rgba(255,255,255,.15);border-radius:5px;cursor:pointer;user-select:none;font-size:clamp(24px,7vw,48px);font-weight:bold;text-shadow:0 0 5px rgba(255,255,255,.45);transition:.15s}.cell:hover{background:rgba(255,255,255,.07)}.cell:active{transform:scale(.94)}.drop{animation:drop .35s ease-out}@keyframes drop{0%{transform:translateY(-45px);opacity:0}70%{transform:translateY(5px)}100%{transform:translateY(0);opacity:1}}.winning-cell{animation:glow .45s ease-in-out infinite alternate}@keyframes glow{from{text-shadow:0 0 4px #fff}to{text-shadow:0 0 15px #fff,0 0 25px rgba(255,255,255,.7)}}.win-line{position:absolute;height:5px;background:#fff;border-radius:50%;transform-origin:left center;pointer-events:none;z-index:50;box-shadow:0 0 5px #fff,0 0 12px rgba(255,255,255,.7);animation:line .9s ease-out forwards}.win-line:after{content:"";position:absolute;left:0;top:2px;width:100%;height:2px;background:rgba(255,255,255,.45)}@keyframes line{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}.hint{text-align:center;margin:13px 0;color:rgba(255,255,255,.75)}button{width:100%;height:50px;border:2px solid rgba(255,255,255,.5);border-radius:10px;background:rgba(0,0,0,.2);color:#fff;font-size:17px;font-weight:bold;cursor:pointer;font-family:inherit}.error{text-align:center;color:#ffd6d6;font-size:14px;min-height:20px}#resultOverlay{position:fixed;inset:0;display:none;justify-content:center;align-items:center;padding:20px;background:rgba(0,0,0,.72);z-index:1000}.result-box{width:100%;max-width:430px;padding:35px 25px;text-align:center;border:3px solid rgba(255,255,255,.5);border-radius:15px;background:#1f4d35;box-shadow:0 0 30px rgba(255,255,255,.2)}#resultText{margin-bottom:25px;font-size:clamp(34px,10vw,52px);font-weight:bold;text-shadow:0 0 12px rgba(255,255,255,.5)}@media(max-width:500px){.game-container{padding:10px}.board-wrapper{padding:6px}.board{gap:3px}.players{gap:4px}.player{font-size:12px}.player-symbol{font-size:23px}}
</style>
<style>
.player.me{box-shadow:inset 0 0 0 2px rgba(255,255,255,.9),0 0 16px rgba(255,255,255,.45);transform:scale(1.04)}
.you-badge{display:block;min-height:18px;margin-top:2px;font-size:12px;font-weight:bold;color:#fff}
.player.me .you-badge::before{content:"👈 あなた";text-shadow:0 0 7px rgba(255,255,255,.8)}
#turnDisplay.my-turn{text-shadow:0 0 10px #fff,0 0 25px rgba(255,255,255,.8);animation:myTurnPulse .8s ease-in-out infinite alternate}
@keyframes myTurnPulse{from{transform:scale(1)}to{transform:scale(1.04)}}
</style>

<style>
/* ×を他の記号と同じくらい見やすく調整 */
#player1 .player-symbol{
    font-size:32px;
}

@media(max-width:500px){
    #player1 .player-symbol{
        font-size:28px;
    }
}
</style>

</head><body>
<div class="game-container">
<h1>🎮 4目落とし</h1><div class="description">黒板で遊ぶ、4人用オンライン対戦</div>
    <div id="myPlayerStatus" class="room-status">あなたのプレイヤー番号を確認中…</div><div id="roomStatus" class="room-status">接続中…</div>
<div class="turn-box"><div class="turn-label">現在のターン</div><div id="turnDisplay">接続中…</div></div>
<div class="players"><div class="player" id="player0"><div class="player-symbol">〇</div>P1</div><div class="player" id="player1"><div class="player-symbol">×</div>P2</div><div class="player" id="player2"><div class="player-symbol">△</div>P3</div><div class="player" id="player3"><div class="player-symbol">□</div>P4</div></div>
<div class="board-wrapper" id="boardWrapper"><div id="board" class="board"></div></div><div id="hint" class="hint">接続しています…</div><div id="error" class="error"></div><button onclick="resetGame()">🔄 ゲームをリセット</button>
</div><div id="resultOverlay"><div class="result-box"><div id="resultText"></div><button onclick="resetGame()">🔄 もう一回遊ぶ</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ROWS=6,COLS=8;
const players=[{name:'プレイヤー1',symbol:'〇'},{name:'プレイヤー2',symbol:'×'},{name:'プレイヤー3',symbol:'△'},{name:'プレイヤー4',symbol:'□'}];
const SUPABASE_URL='https://adjftdxlyvjlaumpejkh.supabase.co';
const SUPABASE_KEY='sb_publishable_qhq0mWdLBc__w6mBVn4-eA_LfOW7t-q';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const roomId=(new URLSearchParams(location.search).get('room')||'').trim();
const channelName='4mokoshi-room-'+(roomId||'no-room');
let clientId=localStorage.getItem('4mokoshi-client-id');if(!clientId){clientId=crypto.randomUUID();localStorage.setItem('4mokoshi-client-id',clientId)}
let joinedAt=Date.now(),channel=null,myPlayer=-1,roster={},board=empty(),currentPlayer=0,gameOver=false,synced=false;
function empty(){return Array.from({length:ROWS},()=>Array(COLS).fill(null))}
function err(x){document.getElementById('error').textContent=x||''}
function initBoard(){const b=document.getElementById('board');b.innerHTML='';for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){let e=document.createElement('div');e.className='cell';e.dataset.row=r;e.dataset.col=c;e.onclick=()=>dropPiece(c);b.appendChild(e)}render()}
function render(){document.querySelectorAll('.cell').forEach(e=>{let r=+e.dataset.row,c=+e.dataset.col;e.textContent='';e.className='cell';if(board[r][c]!==null){e.textContent=players[board[r][c]].symbol;e.classList.add('drop')}})}
function updateRoster(){let a=Object.values(roster).sort((x,y)=>x.joinedAt-y.joinedAt||x.id.localeCompare(y.id));myPlayer=a.findIndex(x=>x.id===clientId);if(myPlayer>=4)myPlayer=-1;for(let i=0;i<4;i++){let e=document.getElementById('player'+i);e.style.opacity=i<a.length?'1':'.45';e.classList.remove('me');if(i===myPlayer)e.classList.add('me')}document.getElementById('roomStatus').textContent=`ルーム: ${roomId||'未指定'}　参加者: ${Math.min(a.length,4)}/4`;updateTurn()}
function updateTurn(){
    const p=players[currentPlayer];
    const display=document.getElementById("turnDisplay");
    const myStatus=document.getElementById("myPlayerStatus");

    display.classList.remove("my-turn");

    document.querySelectorAll(".player").forEach(element=>{
        element.classList.remove("active","me");
    });

    if(myPlayer>=0){
        myStatus.textContent=`あなたは プレイヤー${myPlayer+1}「${players[myPlayer].symbol}」です`;

        const me=document.getElementById("player"+myPlayer);
        if(me) me.classList.add("me");

        if(myPlayer===currentPlayer && !gameOver){
            display.textContent=`🎯 あなたの番！「${p.symbol}」`;
            display.classList.add("my-turn");
        }else if(!gameOver){
            display.textContent=`${p.name}「${p.symbol}」の番`;
        }else{
            display.textContent=`${p.name}「${p.symbol}」`;
        }
    }else{
        myStatus.textContent="参加者を待っています…";
        display.textContent=gameOver ? `${p.name}「${p.symbol}」` : `${p.name}「${p.symbol}」の番`;
    }

    const activePlayer=document.getElementById("player"+currentPlayer);
    if(activePlayer) activePlayer.classList.add("active");

    const hint=document.getElementById("hint");
    if(myPlayer<0) hint.textContent="参加者を待っています…";
    else if(myPlayer===currentPlayer && !gameOver) hint.textContent="👆 あなたの番！ 入れたい列をタップ！";
    else if(gameOver) hint.textContent="ゲーム終了";
    else hint.textContent=p.name+"の番です";
}
async function start(){if(!roomId){err('URLの末尾に ?room=1234 のようにルームIDを付けてください。');return}initBoard();channel=sb.channel(channelName,{config:{presence:{key:clientId}}});channel.on('presence',{event:'sync'},()=>{readPresence();requestSnapshot()}).on('presence',{event:'join'},readPresence).on('presence',{event:'leave'},readPresence).on('broadcast',{event:'state'},p=>{if(p.payload?.room===roomId)applyState(p.payload)}).on('broadcast',{event:'snapshot'},p=>{if(p.payload?.room===roomId&&myPlayer===0)sendState()}).on('broadcast',{event:'reset'},p=>{if(p.payload?.room===roomId&&p.payload.sender!==clientId)applyReset()});channel.subscribe(async status=>{
    if(status==='SUBSCRIBED'){
        err('');
        document.getElementById('roomStatus').textContent=`ルーム: ${roomId}　接続済み`;
        await channel.track({id:clientId,joinedAt});
        // 自分のPresenceが同期されるまで少し待つ。
        // P1なら初期状態を配信、P2以降ならP1へ状態を要求する。
        setTimeout(async()=>{
            readPresence();
            if(myPlayer===0){
                synced=true;
                await sendState();
            }else{
                await requestSnapshot();
            }
        },150);
    }else if(status==='CHANNEL_ERROR'){
        err('Supabase Realtimeに接続できません。');
    }else if(status==='TIMED_OUT'){
        err('接続がタイムアウトしました。再読み込みしてください。');
    }else if(status==='CLOSED'){
        err('接続が閉じられました。ページを再読み込みしてください。');
    }
})}
function readPresence(){
    if(!channel)return;
    const s=channel.presenceState();
    roster={};
    Object.keys(s).forEach(k=>{
        const entries=s[k];
        const v=entries?.[entries.length-1];
        if(v?.id) roster[v.id]=v;
    });
    updateRoster();

    // P1が部屋の現在状態を持つ「ホスト」になる。
    // 初回接続時にP1自身がsnapshotを受け取るのを待たず、
    // すぐstateを配信することで「接続中…」で止まる問題を防ぐ。
    if(myPlayer===0 && synced===false && !gameOver){
        synced=true;
        setTimeout(()=>sendState(),100);
    }
}
async function requestSnapshot(){
    if(!channel)return;
    await channel.send({
        type:'broadcast',
        event:'snapshot',
        payload:{room:roomId,requester:clientId}
    });
}
async function sendState(){
    if(!channel)return;
    await channel.send({
        type:'broadcast',
        event:'state',
        payload:{
            room:roomId,
            board:board.map(row=>row.slice()),
            currentPlayer,
            gameOver,
            sender:clientId
        }
    });
}
function applyState(d){if(!Array.isArray(d.board)||d.board.length!==ROWS)return;board=d.board.map(r=>r.slice());currentPlayer=d.currentPlayer??0;gameOver=!!d.gameOver;synced=true;render();updateTurn();if(gameOver){let line=findAnyWin();if(line){highlight(line);draw(line);setTimeout(()=>show(players[currentPlayer].symbol+'の勝ち！'),950)}else show('引き分け！')}}
function dropPiece(col){if(!synced||gameOver||myPlayer<0)return;if(myPlayer!==currentPlayer){err('今はあなたの番ではありません。');return}err('');let row=-1;for(let r=ROWS-1;r>=0;r--)if(board[r][col]===null){row=r;break}if(row<0)return;board[row][col]=currentPlayer;render();let line=findWin(row,col,currentPlayer);if(line){gameOver=true;highlight(line);draw(line);sendState();setTimeout(()=>show(players[currentPlayer].symbol+'の勝ち！'),950);return}if(full()){gameOver=true;sendState();setTimeout(()=>show('引き分け！'),300);return}currentPlayer=(currentPlayer+1)%4;updateTurn();sendState()}
function findWin(r,c,p){for(let [dr,dc] of [[0,1],[1,0],[1,1],[1,-1]]){let l=both(r,c,dr,dc,p);if(l.length>=4)return choose(l,r,c)}return null}
function findAnyWin(){for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(board[r][c]!==null){let x=findWin(r,c,board[r][c]);if(x)return x}return null}
function both(r,c,dr,dc,p){let l=[],a=r-dr,b=c-dc;while(a>=0&&a<ROWS&&b>=0&&b<COLS&&board[a][b]===p){l.unshift({row:a,col:b});a-=dr;b-=dc}l.push({row:r,col:c});a=r+dr;b=c+dc;while(a>=0&&a<ROWS&&b>=0&&b<COLS&&board[a][b]===p){l.push({row:a,col:b});a+=dr;b+=dc}return l}
function choose(l,r,c){if(l.length===4)return l;let i=l.findIndex(x=>x.row===r&&x.col===c),s=Math.max(0,Math.min(i-3,l.length-4));return l.slice(s,s+4)}
function highlight(l){l.forEach(p=>{let e=document.querySelector(`.cell[data-row="${p.row}"][data-col="${p.col}"]`);if(e)e.classList.add('winning-cell')})}
function draw(l){document.querySelectorAll('.win-line').forEach(e=>e.remove());let w=document.getElementById('boardWrapper'),a=document.querySelector(`.cell[data-row="${l[0].row}"][data-col="${l[0].col}"]`),b=document.querySelector(`.cell[data-row="${l[3].row}"][data-col="${l[3].col}"]`);if(!a||!b)return;let wr=w.getBoundingClientRect(),x=a.getBoundingClientRect(),y=b.getBoundingClientRect(),x1=x.left-wr.left+x.width/2,y1=x.top-wr.top+x.height/2,x2=y.left-wr.left+y.width/2,y2=y.top-wr.top+y.height/2,e=document.createElement('div'),len=Math.hypot(x2-x1,y2-y1),ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;e.className='win-line';e.style.width=len+'px';e.style.left=x1+'px';e.style.top=y1+'px';e.style.transform=`rotate(${ang}deg)`;w.appendChild(e)}
function full(){return board[0].every(x=>x!==null)}
function show(m){document.getElementById('resultText').textContent=m;document.getElementById('resultOverlay').style.display='flex'}
function applyReset(){board=empty();currentPlayer=0;gameOver=false;synced=true;document.querySelectorAll('.win-line').forEach(e=>e.remove());document.getElementById('resultOverlay').style.display='none';initBoard();updateTurn();err('')}
async function resetGame(){if(myPlayer!==0){err('ゲームのリセットはプレイヤー1が行えます。');return}applyReset();await channel.send({type:'broadcast',event:'reset',payload:{room:roomId,sender:clientId}});await sendState()}
window.addEventListener('resize',()=>{let l=findAnyWin();if(l)draw(l)});start();
</script></body></html>
